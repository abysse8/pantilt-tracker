# CONFIGURATION DE LA DÉMO — caméra fixée sur la partie mobile.
# Une ligne = une clé et sa valeur. Les noms des clés correspondent au code C.
# Une ligne commençant par # est ignorée ; un commentaire après une valeur aussi.
# Les dimensions doivent être identiques à celles demandées à rpicam-vid.
# Le programme attend du YUV420 compact : largeur multiple de 64, hauteur paire.
width = 640
height = 480
# Le CSV est remplacé à chaque lancement ; valeur vide pour le désactiver.
log_path = suivi.csv
# Bus et adresse : utiles seulement avec -a (mode matériel).
# 0x40 est une écriture hexadécimale, à comparer avec i2cdetect.
i2c_dev = /dev/i2c-1
i2c_addr = 0x40

# VISION : 0 = plus grand groupe lumineux ; 1 = groupe respectant aussi U et V.
# Y : luminosité. U/V : couleur. Les seuils vont de 0 à 255.
# Les valeurs U/V ci-dessous acceptent toutes les couleurs : à régler sur vos images.
use_color = 0
y_min = 240
u_min = 0
u_max = 255
v_min = 0
v_max = 255
# Ignorer les groupes trop petits pour éviter les reflets isolés.
# La surface compte les points APRÈS sous-échantillonnage.
min_area = 20
# Pas de 2 : une ligne et une colonne sur deux, soit environ 1/4 des pixels.
step = 2

# COMMANDE PROPORTIONNELLE : une grande erreur produit une grande vitesse.
# kp en s⁻¹ : augmenter rend la correction plus réactive, mais peut faire osciller.
kp = 2
# Champs de vision approximatifs : angle visible sur toute la largeur/hauteur.
# Ils dépendent de la caméra et du mode vidéo ; ce sont des exemples.
hfov_deg = 66
vfov_deg = 41
# Erreur tolérée autour du centre, en pixels, pour limiter les tremblements.
deadband_px = 8
# Limite de vitesse de chaque axe, en degrés par seconde.
max_speed_deg_s = 20
# Sens du montage : seulement +1 ou -1. Inverser si le mouvement aggrave l'erreur.
pan_dir = 1
tilt_dir = 1

# SERVOS : EXEMPLES, PAS DES CARACTÉRISTIQUES CONFIRMÉES DE VOS MOTEURS.
# Vérifier références, course et impulsions avant d'utiliser -a.
# La position centrale elle-même peut déplacer fortement un montage mal réglé.
# Butées étroites pour les premiers essais : ±10° autour du centre illustratif.
# channel : voie de la carte (0..15) ; les deux servos doivent être sur des voies distinctes.
# range_deg : course totale utilisée pour convertir l'angle en durée d'impulsion.
# min_us/max_us : durées en microsecondes correspondant à 0° et à range_deg.
# min_deg/max_deg : butées logicielles à l'intérieur de cette course.
# center_deg : consigne envoyée au démarrage, à vérifier mécaniquement.
pan_channel = 0
pan_range_deg = 270
pan_min_us = 500
pan_max_us = 2500
pan_min_deg = 125
pan_max_deg = 145
pan_center_deg = 135

# Deuxième axe : haut/bas, avec sa propre course et ses propres butées.
tilt_channel = 1
tilt_range_deg = 180
tilt_min_us = 500
tilt_max_us = 2500
tilt_min_deg = 80
tilt_max_deg = 100
tilt_center_deg = 90
